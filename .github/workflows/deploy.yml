name: Deploy nmt.in.ua

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nmt-in-ua
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to nmt.in.ua hosting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://nmt.in.ua
      REMOTE_ARCHIVE: /home/levelhst/next-build.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Pack .next
        run: |
          tar -czf next-build.tar.gz .next
          ls -lh next-build.tar.gz

      # OpenSSH often rejects the same key that appleboy (Go SSH) accepts.
      # SCP is also blocked on this host. Publish the archive as a workflow
      # artifact, then pull it on the server with the working SSH action.
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Pull artifact, unpack, and restart
        uses: appleboy/ssh-action@v1.2.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          REMOTE_ARCHIVE: /home/levelhst/next-build.tar.gz
        with:
          host: levelhst.ftp.tools
          username: levelhst
          key: ${{ secrets.NMT_HOSTING_SSH_KEY }}
          fingerprint: SHA256:ozhEu5ShQNp1fRdWNdC1gvn50IXVsGQ/JriD9Ht4u6o
          command_timeout: 20m
          envs: GH_TOKEN,GH_REPO,GH_RUN_ID,REMOTE_ARCHIVE
          script: |
            set -euo pipefail
            export PATH="/usr/local/node24/bin:/usr/local/bin:/usr/bin:${PATH}"

            SITE_DIR="/home/levelhst/nmt.in.ua/www"
            TMP_DIR="/home/levelhst/nmt-deploy-tmp"
            mkdir -p "$TMP_DIR"
            cd "$TMP_DIR"

            echo "Resolving build artifact for run ${GH_RUN_ID}"
            ARTIFACT_JSON="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPO}/actions/runs/${GH_RUN_ID}/artifacts")"

            ARTIFACT_ID="$(printf '%s' "$ARTIFACT_JSON" | python3 -c '
            import json, sys
            data = json.load(sys.stdin)
            arts = [a for a in data.get("artifacts", []) if a.get("name") == "next-build" and not a.get("expired")]
            if not arts:
                raise SystemExit("artifact next-build not found")
            print(arts[0]["id"])
            ')"

            echo "Downloading artifact id=${ARTIFACT_ID}"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -L "https://api.github.com/repos/${GH_REPO}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o artifact.zip

            rm -f next-build.tar.gz
            python3 - <<'PY'
            import zipfile
            with zipfile.ZipFile("artifact.zip") as zf:
                names = zf.namelist()
                match = next((n for n in names if n.endswith("next-build.tar.gz") or n == "next-build.tar.gz"), None)
                if not match:
                    raise SystemExit(f"next-build.tar.gz missing in artifact: {names}")
                zf.extract(match, ".")
                if match != "next-build.tar.gz":
                    import os, shutil
                    shutil.move(match, "next-build.tar.gz")
            PY

            mv -f next-build.tar.gz "$REMOTE_ARCHIVE"
            ls -lh "$REMOTE_ARCHIVE"
            rm -rf "$TMP_DIR"

            cd "$SITE_DIR"
            while read -r pid; do
              [ -n "$pid" ] || continue
              kill "$pid" 2>/dev/null || true
            done < <(pgrep -f '/home/levelhst/nmt.in.ua/www.*(npm run start|node server\.js)' || true)

            git fetch origin main
            git checkout main
            git reset --hard origin/main
            export DEPLOY_ARCHIVE="$REMOTE_ARCHIVE"
            bash ./deploy.sh
