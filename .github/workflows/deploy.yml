name: Deploy nmt.in.ua

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nmt-in-ua
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to nmt.in.ua hosting
    runs-on: ubuntu-latest
    steps:
      - name: Deploy only nmt.in.ua
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: levelhst.ftp.tools
          username: levelhst
          key: ${{ secrets.NMT_HOSTING_SSH_KEY }}
          fingerprint: SHA256:ozhEu5ShQNp1fRdWNdC1gvn50IXVsGQ/JriD9Ht4u6o
          command_timeout: 25m
          script: |
            set -euo pipefail
            export PATH="/usr/local/node24/bin:/usr/local/bin:/usr/bin:${PATH}"
            SITE_DIR="/home/levelhst/nmt.in.ua/www"
            cd "$SITE_DIR"
            # Pull latest first so the fixed deploy.sh is what we run.
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            bash ./deploy.sh
